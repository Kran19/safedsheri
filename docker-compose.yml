version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: safedsheri-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safedsheri
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safedsheri"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - safedsheri-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: safedsheri-api
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/safedsheri?schema=public
      PORT: ${PORT:-4000}
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-info@safedsheri.com}
      SMTP_PASS: ${SMTP_PASS:-SafedSheri@2026###}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-"*"}
      ZAPLE_API_KEY: ${ZAPLE_API_KEY}
      ZAPLE_API_SECRET: ${ZAPLE_API_SECRET}
      ZAPLE_API_URL: ${ZAPLE_API_URL}
      ZAPLE_TEMPLATE_ID: ${ZAPLE_TEMPLATE_ID}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - safedsheri-net

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: safedsheri-admin
    restart: always
    env_file:
      - .env
    environment:
      INTERNAL_API_URL: http://api:4000/api/v1
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-rzp_test_TU3glApQtNIVtN}
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - safedsheri-net

volumes:
  postgres_data:

networks:
  safedsheri-net:
    driver: bridge
