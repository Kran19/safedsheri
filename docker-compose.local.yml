version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: safedsheri-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safedsheri
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d safedsheri"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - safedsheri-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: safedsheri-api
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/safedsheri?schema=public
      PORT: 4000
      NODE_ENV: development
      JWT_SECRET: safedsheri_jwt_super_secret_key_2026
      JWT_EXPIRES_IN: 1d
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - safedsheri-net

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: safedsheri-admin
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - safedsheri-net

volumes:
  postgres_data:

networks:
  safedsheri-net:
    driver: bridge
